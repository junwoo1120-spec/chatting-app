<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>채팅방</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #e8ede8;
      --panel: #f7f9f6;
      --ink: #1b2420;
      --muted: #6b7a72;
      --line: #d3dbd4;
      --mine: #1f4e46;
      --mine-ink: #f3f7f4;
      --other: #ffffff;
      --online: #3fa37a;
      --danger: #b3382c;
      --font: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a17;
        --panel: #1b2420;
        --ink: #e6ede8;
        --muted: #8fa097;
        --line: #2b3832;
        --mine: #2f7a6c;
        --mine-ink: #f3f7f4;
        --other: #232f2a;
        --danger: #e27a6e;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }

    /* ---------- 닉네임 입력 화면 ---------- */
    .join {
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .join-box { width: 100%; max-width: 340px; }
    .join-box h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.02em; }
    .join-box p { margin: 0 0 24px; color: var(--muted); }
    .field {
      display: flex;
      gap: 8px;
    }
    .field input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    .field button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--mine);
      color: var(--mine-ink);
      font-weight: 600;
      cursor: pointer;
    }
    .field button:disabled { opacity: 0.5; cursor: default; }
    .error { min-height: 22px; margin: 8px 2px 0; color: var(--danger); font-size: 14px; }

    /* ---------- 채팅 화면 ---------- */
    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: 240px 1fr;
      padding-top: env(safe-area-inset-top, 0px);
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar h2 {
      margin: 0;
      padding: 18px 18px 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .user-list { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; }
    .user-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .user-list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-list .me-tag { margin-left: auto; font-size: 12px; color: var(--muted); }

    .avatar {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .topbar strong { font-size: 16px; }
    .users-toggle {
      display: none;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .users-toggle .dot, .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      margin-right: 6px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .row { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
    .row.me { justify-content: flex-end; }
    .row.other { justify-content: flex-start; }
    .row.gap { margin-top: 10px; }

    .bubble-wrap { display: flex; flex-direction: column; max-width: min(75%, 520px); }
    .row.me .bubble-wrap { align-items: flex-end; }
    .sender { font-size: 13px; color: var(--muted); margin: 0 4px 3px; }
    .bubble {
      padding: 9px 13px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .row.me .bubble { background: var(--mine); color: var(--mine-ink); border-bottom-right-radius: 5px; }
    .row.other .bubble { background: var(--other); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .time { flex: none; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
    .row.me .time { order: -1; }

    .system { align-self: center; margin: 10px 0; font-size: 13px; color: var(--muted); }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .composer input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
    }
    .composer button {
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--mine);
      color: var(--mine-ink);
      font-weight: 600;
      cursor: pointer;
    }

    .conn-banner {
      padding: 6px 18px;
      font-size: 13px;
      background: var(--danger);
      color: #fff;
      text-align: center;
    }

    /* ---------- 모바일 ---------- */
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
      .users-toggle { display: inline-flex; align-items: center; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(280px, 85vw);
        z-index: 10;
        padding-top: env(safe-area-inset-top, 0px);
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      .sidebar.open { transform: translateX(0); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35); }
      .bubble-wrap { max-width: 82%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sidebar { transition: none; }
    }
  </style>
</head>
<body>
  <!-- 닉네임 입력 -->
  <section class="join" id="join">
    <form class="join-box" id="joinForm">
      <h1>닉네임을 정해 주세요</h1>
      <p>채팅방에서 이 이름으로 보여요.</p>
      <div class="field">
        <input id="nickInput" type="text" maxlength="12" placeholder="최대 12자" autocomplete="off" autofocus />
        <button type="submit" id="joinBtn">입장하기</button>
      </div>
      <div class="error" id="joinError" role="alert"></div>
    </form>
  </section>

  <!-- 채팅 -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <h2 id="userTitle">접속 중 0명</h2>
      <ul class="user-list" id="userList"></ul>
    </aside>

    <div class="main">
      <div class="topbar">
        <strong>채팅방</strong>
        <button class="users-toggle" id="usersToggle" type="button">
          <span class="dot"></span><span id="userCountBtn">0명</span>
        </button>
      </div>
      <div class="conn-banner" id="connBanner" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <input id="msgInput" type="text" maxlength="500" placeholder="메시지 입력" autocomplete="off" />
        <button type="submit">보내기</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (sel) => document.querySelector(sel);

    let myId = null;
    let myNickname = null;
    let lastSenderId = null;

    const joinSection = $("#join");
    const appSection = $("#app");
    const joinForm = $("#joinForm");
    const nickInput = $("#nickInput");
    const joinBtn = $("#joinBtn");
    const joinError = $("#joinError");
    const messagesEl = $("#messages");
    const userListEl = $("#userList");
    const sidebar = $("#sidebar");

    // 닉네임별 고정 색상
    function colorFor(name) {
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
      return `hsl(${h}, 42%, 40%)`;
    }

    function makeAvatar(name) {
      const el = document.createElement("div");
      el.className = "avatar";
      el.style.background = colorFor(name);
      el.textContent = [...name][0] || "?";
      return el;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
    }

    // ---------- 입장 ----------
    function join(nickname, onFail) {
      socket.emit("join", nickname, (res) => {
        if (!res.ok) return onFail(res.error);
        myId = res.id;
        myNickname = res.nickname;
        joinSection.hidden = true;
        appSection.hidden = false;
        $("#msgInput").focus();
      });
    }

    joinForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const nickname = nickInput.value.trim();
      if (!nickname) {
        joinError.textContent = "닉네임을 입력해 주세요.";
        return;
      }
      joinBtn.disabled = true;
      joinError.textContent = "";
      join(nickname, (error) => {
        joinError.textContent = error;
        joinBtn.disabled = false;
      });
    });

    // ---------- 메시지 ----------
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(msg) {
      const mine = msg.senderId === myId;
      const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
      const isFirstOfGroup = lastSenderId !== msg.senderId;

      const row = document.createElement("div");
      row.className = `row ${mine ? "me" : "other"}${isFirstOfGroup ? " gap" : ""}`;

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      if (!mine && isFirstOfGroup) {
        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = msg.nickname;
        wrap.appendChild(sender);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.text;
      wrap.appendChild(bubble);

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = formatTime(msg.time);

      row.append(wrap, time);
      messagesEl.appendChild(row);
      lastSenderId = msg.senderId;

      if (mine || nearBottom) scrollToBottom();
    }

    function addSystem(text) {
      const el = document.createElement("div");
      el.className = "system";
      el.textContent = text;
      messagesEl.appendChild(el);
      lastSenderId = null;
      scrollToBottom();
    }

    $("#composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("#msgInput");
      const text = input.value.trim();
      if (!text) return;
      socket.emit("message", text);
      input.value = "";
    });

    // ---------- 접속자 목록 ----------
    function renderUsers(users) {
      $("#userTitle").textContent = `접속 중 ${users.length}명`;
      $("#userCountBtn").textContent = `${users.length}명`;
      userListEl.replaceChildren();

      for (const u of users) {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = u.nickname;
        li.append(makeAvatar(u.nickname), name);

        if (u.id === myId) {
          const tag = document.createElement("span");
          tag.className = "me-tag";
          tag.textContent = "나";
          li.appendChild(tag);
        }
        userListEl.appendChild(li);
      }
    }

    $("#usersToggle").addEventListener("click", () => sidebar.classList.toggle("open"));
    document.addEventListener("click", (e) => {
      if (!sidebar.classList.contains("open")) return;
      if (sidebar.contains(e.target) || $("#usersToggle").contains(e.target)) return;
      sidebar.classList.remove("open");
    });

    // ---------- 소켓 이벤트 ----------
    socket.on("message", addMessage);
    socket.on("system", addSystem);
    socket.on("users", renderUsers);

    socket.on("disconnect", () => { $("#connBanner").hidden = false; });

    // 연결이 끊겼다 복구되면 같은 닉네임으로 다시 입장
    socket.on("connect", () => {
      $("#connBanner").hidden = true;
      if (!myNickname) return;
      join(myNickname, () => {
        // 닉네임을 다른 사람이 가져간 경우 처음 화면으로
        myNickname = null;
        appSection.hidden = true;
        joinSection.hidden = false;
        joinBtn.disabled = false;
        joinError.textContent = "연결이 끊긴 사이 닉네임이 사용 중이에요. 다른 닉네임을 입력해 주세요.";
        nickInput.focus();
      });
    });
  </script>
</body>
</html>
